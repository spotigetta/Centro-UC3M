<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000066"><meta name="description" content="Centro de estudio UC3M"><link rel="icon" href="icon.svg?v=__UC3M_BUILD__"><link rel="manifest" href="manifest.webmanifest?v=__UC3M_BUILD__"><link rel="stylesheet" href="styles.css?v=__UC3M_BUILD__"><link rel="stylesheet" href="unified.css?v=__UC3M_BUILD__"><title>Centro UC3M</title></head>
<body><div class="app">
<header class="uc-header"><div class="brand"><img src="logo-uc3m.png" alt="Universidad Carlos III de Madrid"><div><small>UC3M / CENTRO DE ESTUDIO</small><h1>Panel UC3M</h1></div></div><div class="header-actions"><button id="notifications">✦ Avisos</button><button id="sync">↻ Sincronizar</button><button id="settings">GitHub ⚙</button></div></header>
<section class="controls"><label>Asignatura<select id="subject-filter"><option value="">Todas</option></select></label><label class="search">Buscar<input id="search" type="search" placeholder="Actividades, prácticas, archivos y documentos"></label></section>
<nav class="tabs" aria-label="Vistas del centro"><button data-tab="board" class="active">Asignaturas</button><button data-tab="calendar">Calendario</button><button data-tab="projects">Proyectos</button><button data-tab="notes">Apuntes</button><button data-tab="reports">Informes y presentaciones</button><button data-tab="mail">Correo académico</button><button data-tab="assistant">Asistente IA</button></nav>
<section id="digest" class="digest"></section><main id="content" aria-live="polite"></main><footer><span id="status">Cargando…</span></footer></div>
<script>(()=>{setTimeout(()=>{const status=document.querySelector('#status');if(!status?.textContent.startsWith('Cargando'))return;status.textContent='La aplicación no ha podido iniciar. ';const retry=document.createElement('button');retry.type='button';retry.textContent='Recargar versión nueva';retry.onclick=async()=>{for(const registration of await navigator.serviceWorker?.getRegistrations?.()||[])await registration.unregister();for(const key of await globalThis.caches?.keys?.()||[])await globalThis.caches.delete(key);location.replace(location.pathname+'?actualizar='+Date.now())};status.append(retry)},8000)})();</script>
<dialog id="modal"><form method="dialog"><button class="close" aria-label="Cerrar">×</button><div id="modal-body"></div></form></dialog><script src="shared/academic-core.js?v=__UC3M_BUILD__" defer></script><script src="shared/overview.js?v=__UC3M_BUILD__" defer></script><script src="shared/markdown.js?v=__UC3M_BUILD__" defer></script><script src="shared/course-art.js?v=__UC3M_BUILD__" defer></script><script src="shared/week-plan.js?v=__UC3M_BUILD__" defer></script><script src="app.js?v=__UC3M_BUILD__" defer></script></body></html>
